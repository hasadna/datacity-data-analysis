name: Lamas tests

on:
  pull_request:
    paths:
      - 'Lamas/**'
      - '.github/workflows/lamas-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'Lamas/**'
      - '.github/workflows/lamas-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lamas package
        run: pip install -e "Lamas/[dev]"

      - name: Run pytest
        run: pytest Lamas/tests/ -v
